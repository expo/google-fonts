name: Sync Changes
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  sync-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run sync-packages
        run: yarn sync-packages
